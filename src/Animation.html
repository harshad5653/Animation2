<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Jewelry Card</title>

    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="min-h-screen bg-amber-400">
    <!-- first card -->

    <!-- Responsive Card -->
    <main class="mx-auto flex min-h-screen w-full max-w-7xl items-center justify-center">

        <div class="group relative mx-auto h-130 w-full max-w-sm overflow-hidden
                    rounded-2xl shadow-2xl shadow-black/40
                    sm:h-[540px] sm:max-w-md
                    lg:h-[560px] lg:max-w-lg
                    xl:max-w-xl">

            <!-- Background image -->
            <img src="card1.jpg" alt="New jewelry collection" class="absolute inset-0 h-full w-full object-cover
                       transition-transform duration-700 ease-in-out
                       group-hover:scale-110">

            <!-- Dark gradient overlay -->
            <div class="absolute inset-0 z-[1] bg-gradient-to-t
                        from-black/95 via-black/40 to-black/10">
            </div>

            <!-- Floating heart balloons -->

            <!-- Random floating heart balloons -->
            <div class="pointer-events-none absolute inset-0 z-[2] overflow-hidden">

                <i class="bi bi-balloon-heart balloon balloon-1
        absolute left-[8%] text-3xl text-pink-400"></i>

                <i class="bi bi-balloon-heart balloon balloon-2
        absolute left-[35%] text-4xl text-rose-300"></i>

                <i class="bi bi-balloon-heart balloon balloon-3
        absolute left-[65%] text-2xl text-pink-300"></i>

                <i class="bi bi-balloon-heart balloon balloon-4
        absolute left-[82%] text-3xl text-red-300"></i>

                <i class="bi bi-balloon-heart balloon balloon-5
        absolute left-[48%] text-2xl text-rose-200"></i>

                <i class="bi bi-balloon-heart balloon balloon-6
        absolute left-[18%] text-xl text-pink-200"></i>

            </div>




            <!-- Top heading -->
            <div class="absolute left-4 right-4 top-6 z-10 flex items-center gap-3
                        pb-3 sm:left-6 sm:right-6 sm:top-8
                        after:absolute after:bottom-0 after:left-0
                        after:h-[2px] after:w-full
                        after:bg-gradient-to-r after:from-amber-200
                        after:via-amber-200/60 after:to-transparent">

                <i class="bi bi-gem shrink-0 text-2xl text-firstheading"></i>

                <h3 class="text-xl font-semibold italic capitalize text-firstheading
                           sm:text-2xl lg:text-3xl">
                    New Arrivals
                </h3>

            </div>

            <!-- Main content -->
            <div class="absolute inset-x-4 bottom-6 z-10 flex flex-col items-start
                        gap-3 sm:inset-x-6 sm:bottom-8 sm:gap-4">

                <h4 class="max-w-lg font-serif text-3xl font-bold leading-tight
                           text-rose-100 sm:text-4xl lg:text-5xl">
                    Discover the Latest Jewelry Collection
                </h4>

                <p class="max-w-md text-sm leading-relaxed text-yellow-200 sm:text-base">
                    Explore our newest designs, crafted to make every moment shine.
                </p>

                <!-- Call-to-action button -->
                <button type="button" class="group/btn inline-flex max-w-full items-center justify-center
                           gap-2 rounded-xl border border-amber-200/60
                           bg-buttontone px-3 py-3 text-xs font-bold text-white
                           transition-all duration-300
                           hover:scale-105 hover:rounded-3xl
                           hover:bg-orange-300 hover:text-cyan-900
                           sm:gap-3 sm:px-5 sm:text-sm">

                    <span>SHOP NEW ARRIVALS</span>

                    <i class="bi bi-arrow-right shrink-0 text-lg text-emerald-300
                              transition-transform duration-300
                              group-hover/btn:translate-x-2
                              group-hover/btn:text-cyan-900">
                    </i>

                </button>

            </div>

        </div>

    </main>

    <!-- card2 -->
    <main class="mx-auto flex min-h-screen w-full max-w-7xl items-center justify-center">

        <div class="group relative mx-auto h-130 w-full max-w-sm overflow-hidden
                    rounded-2xl shadow-2xl shadow-black/40 sm:h-[540px] sm:max-w-md lg:h-[560px] lg:max-w-lg xl:max-w-xl">
                      <div class="text absolute top-19 left-3.5 flex gap-2 items-center z-10"><div class="h-px w-2.5 bg-amber-500 "></div>
                    <h3 class="text-firstheading font-semibold">Exclusive Offers</h3>
                     <div class="h-px w-2.5 bg-amber-500"></div></div>
                     <div class="poster absolute z-20 bottom-52 pl-2.5 flex flex-col gap-3.5">
                        <h5 class="text-amber-50 font-serif text-4xl ">Shine More</h5>
                        <h4 class="text-amber-200 font-mono text-3xl font-extralight"> Save More</h4>
                        <p class="text-center text-amber-50">Enjoy special offers on
selected jewelry collections.
</p>
                        <div class="flex gap-3 bg-gray-800 p-2 rounded-2xl w-1/2 items-center"><i class="bi bi-gem text-firstheading"></i>
                        <p class="text-yellow-300 font-bold">UP TO 30% OFF</p></div>
                        <button class="border overflow-hidden absolute top-65 left-10 bg-cyan-950 p-1.5 rounded-2xl border-amber-50 w-1/2 text-amber-200 font-bold hover:text-pink-600 hover:border transform ease-linear duration-700 hover:border-pink-600 hover:p-2.5 "> SHOP OFFERS <i class="bi bi-arrow-bar-right"></i></button>
                     </div>
                  <img src="card2.jpg" alt="card2.jpg" class="object-cover transition-transform ease-linear duration-700 group-hover:scale-110">
                  
                  
        </div>
    </main>


</body>

</html>
